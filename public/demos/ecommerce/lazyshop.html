<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>LazyShop</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"
/>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,sans-serif;
  background:#f5f7fb;
  color:#111827;
  min-height:100vh;
}

:root{
  --primary:#111827;
  --primary-soft:#f1f3f7;
  --muted:#6b7280;
  --border:#e5e7eb;
  --card:#ffffff;
  --radius:18px;
}

/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
  white-space:nowrap;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.search-wrapper{
  position:relative;
}

.search-wrapper input{
  width:260px;
  padding:11px 16px 11px 40px;

  border:1px solid var(--border);
  border-radius:999px;

  background:#f8fafc;
  outline:none;

  font-family:inherit;
  font-size:14px;

  transition:.2s ease;
}

.search-wrapper input:focus{
  background:#fff;
  border-color:#9ca3af;
  box-shadow:0 0 0 4px rgba(17,24,39,.06);
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:14px;
}

/* =====================================================
   BUTTONS
===================================================== */

button{
  border:none;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
}

.cart-btn{
  display:flex;
  align-items:center;
  gap:7px;

  padding:11px 16px;

  background:var(--primary);
  color:#fff;

  border-radius:999px;

  transition:.2s ease;
}

.cart-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.cart-count{
  background:#fff;
  color:#111827;

  min-width:20px;
  height:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  font-size:11px;
  font-weight:800;
}

/* =====================================================
   MAIN LAYOUT
===================================================== */

.main{
  max-width:1200px;
  margin:30px auto;

  display:grid;
  grid-template-columns:230px 1fr;

  gap:28px;

  padding:0 20px;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  background:#fff;

  border:1px solid var(--border);
  border-radius:var(--radius);

  padding:18px;

  height:fit-content;

  position:sticky;
  top:95px;

  box-shadow:0 8px 25px rgba(0,0,0,.04);
}

.sidebar-header{
  margin-bottom:15px;
}

.sidebar h3{
  font-size:16px;
  font-weight:700;
}

.sidebar-subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.category-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.category-list button{
  width:100%;

  padding:11px 13px;

  border-radius:12px;

  background:transparent;
  color:#374151;

  text-align:left;

  font-size:14px;

  transition:.2s ease;
}

.category-list button:hover{
  background:var(--primary-soft);
  color:#111827;
}

.category-list button.active{
  background:var(--primary);
  color:#fff;
}

/* =====================================================
   MOBILE CATEGORY BAR
===================================================== */

.mobile-categories{
  display:none;
}

/* =====================================================
   PRODUCTS HEADER
===================================================== */

.products-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  margin-bottom:18px;
}

.products-title{
  font-size:25px;
  font-weight:800;
  letter-spacing:-.6px;
}

.products-subtitle{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
}

/* =====================================================
   PRODUCT GRID
===================================================== */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.grid a{
  text-decoration:none;
  color:inherit;
}

.card{
  background:var(--card);

  border:1px solid rgba(229,231,235,.8);

  border-radius:var(--radius);

  overflow:hidden;

  box-shadow:0 6px 20px rgba(0,0,0,.045);

  transition:
    transform .22s ease,
    box-shadow .22s ease;
}

.card:hover{
  transform:translateY(-5px);

  box-shadow:
    0 18px 40px rgba(0,0,0,.09);
}

.product-image{
  position:relative;
  overflow:hidden;
  background:#f3f4f6;
}

.card img{
  width:100%;
  height:205px;

  display:block;

  object-fit:cover;

  transition:transform .35s ease;
}

.card:hover img{
  transform:scale(1.04);
}

.card-body{
  padding:15px;
}

.product-name{
  font-size:15px;
  font-weight:700;

  display:block;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price{
  font-size:15px;
  font-weight:700;

  margin-top:7px;

  color:#111827;
}

.rating{
  font-size:12px;

  margin-top:6px;

  color:var(--muted);
}

.add-to-cart{
  width:100%;

  margin-top:13px;

  padding:11px;

  background:#111827;
  color:#fff;

  border-radius:11px;

  transition:.2s ease;
}

.add-to-cart:hover{
  background:#374151;
}

/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state{
  grid-column:1/-1;

  background:#fff;

  border:1px dashed var(--border);

  border-radius:var(--radius);

  padding:60px 20px;

  text-align:center;
}

.empty-state-icon{
  font-size:35px;
  margin-bottom:10px;
}

.empty-state h3{
  font-size:17px;
}

.empty-state p{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

/* =====================================================
   FLOATING CART
===================================================== */

.floating-cart{
  position:fixed;

  right:22px;
  bottom:22px;

  width:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#111827;
  color:#fff;

  border-radius:50%;

  text-decoration:none;

  font-size:23px;

  box-shadow:
    0 12px 30px rgba(0,0,0,.25);

  z-index:1000;

  transition:.2s ease;
}

.floating-cart:hover{
  transform:translateY(-3px);
}

.floating-cart-count{
  position:absolute;

  top:-5px;
  right:-5px;

  background:#ef4444;
  color:#fff;

  min-width:20px;
  height:20px;

  padding:2px 5px;

  border-radius:50%;

  display:none;

  align-items:center;
  justify-content:center;

  font-size:11px;
  font-weight:700;

  border:2px solid #fff;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  left:50%;
  bottom:95px;

  transform:translate(-50%,15px);

  background:#111827;
  color:#fff;

  padding:12px 18px;

  border-radius:12px;

  font-size:13px;

  opacity:0;

  pointer-events:none;

  transition:.25s ease;

  z-index:2000;

  box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =====================================================
   FOOTER
===================================================== */

    /* ================= FOOTER ================= */

    .footer {
      background: var(--surface);

      color: var(--text);

      padding: 35px 20px 12px;

      margin-top: 40px;

      border-top: 1px solid var(--border);
    }

    .footer-container {
      max-width: 1200px;

      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

      gap: 25px;
    }

    .footer-section h3,
    .footer-section h4 {
      margin-bottom: 10px;

      color: var(--heading);
    }

    .footer-section p {
      font-size: 14px;

      margin-bottom: 6px;

      color: var(--text);
    }

    .footer-section a {
      display: block;

      font-size: 14px;

      color: var(--text);

      margin-bottom: 6px;

      text-decoration: none;
    }

    .footer-section a:hover {
      color: var(--secondary);
    }

    .footer-bottom {
      text-align: center;

      max-width: 1200px;

      margin: 25px auto 0;

      border-top: 1px solid var(--border);

      padding-top: 12px;

      font-size: 13px;

      color: var(--muted);
    }

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

  .main{
    grid-template-columns:200px 1fr;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .search-wrapper input{
    width:210px;
  }

}

/* =====================================================
   TABLET / MOBILE
===================================================== */

@media(max-width:700px){

  .nav{
    padding:13px 15px;
  }

  .logo{
    font-size:19px;
  }

  .search-wrapper{
    flex:1;
  }

  .search-wrapper input{
    width:100%;
  }

  .cart-btn{
    padding:10px 13px;
  }

  .cart-btn span:first-child{
    display:none;
  }

  .main{
    display:block;

    margin:20px auto;

    padding:0 15px;
  }

  .sidebar{
    display:none;
  }

  .mobile-categories{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:0 15px 15px;

    scrollbar-width:none;
  }

  .mobile-categories::-webkit-scrollbar{
    display:none;
  }

  .mobile-categories button{
    flex-shrink:0;

    padding:9px 14px;

    border:1px solid var(--border);

    border-radius:999px;

    background:#fff;

    color:#374151;

    font-size:12px;
  }

  .mobile-categories button.active{
    background:#111827;
    color:#fff;
    border-color:#111827;
  }

  .products-header{
    margin-top:8px;
  }

}

/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:480px){

  .nav{
    gap:8px;
  }

  .logo{
    display:none;
  }

  .search-wrapper input{
    font-size:13px;
  }

  .main{
    margin-top:15px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:15px;
  }

  .card img{
    height:220px;
  }

  .products-title{
    font-size:21px;
  }

  .floating-cart{
    width:54px;
    height:54px;

    right:16px;
    bottom:16px;
  }

}

</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="nav">

    <div class="logo">
      LazyShop
    </div>

    <div class="nav-right">

      <div class="search-wrapper">

        <span class="search-icon">⌕</span>

        <input
          id="search"
          type="text"
          placeholder="Search products..."
        />

      </div>

      <a href="/demos/ecommerce/cart.html">

        <button class="cart-btn">

          <span>Cart</span>

          🛒

          <span
            id="cartCount"
            class="cart-count"
            style="display:none"
          >
            0
          </span>

        </button>

      </a>

    </div>

  </div>

</header>


<!-- =====================================================
     MOBILE CATEGORIES
===================================================== -->

<div class="mobile-categories">

  <button class="active" data-cat="all">
    All
  </button>

  <button data-cat="dress">
    Dresses
  </button>

  <button data-cat="shoe">
    Shoes
  </button>

  <button data-cat="accessories">
    Accessories
  </button>

  <button data-cat="kitchen">
    Kitchen
  </button>

  <button data-cat="light">
    Lighting
  </button>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-header">

      <h3>Categories</h3>

      <p class="sidebar-subtitle">
        Browse our collection
      </p>

    </div>

    <div class="category-list">

      <button class="active" data-cat="all">
        All Products
      </button>

      <button data-cat="dress">
        Dresses
      </button>

      <button data-cat="shoe">
        Shoes
      </button>

      <button data-cat="accessories">
        Accessories
      </button>

      <button data-cat="kitchen">
        Kitchen
      </button>

      <button data-cat="light">
        Lighting
      </button>

    </div>

  </aside>


  <!-- PRODUCTS -->

  <section>

    <div class="products-header">

      <div>

        <h1 class="products-title">
          Products
        </h1>

        <p class="products-subtitle">
          Find something you'll love.
        </p>

      </div>

    </div>

    <div
      id="productGrid"
      class="grid"
    ></div>

  </section>

</div>


<!-- =====================================================
     FLOATING CART
===================================================== -->

<a
  href="/demos/ecommerce/cart.html"
  class="floating-cart"
>

  🛒

  <span
    id="floatingCartCount"
    class="floating-cart-count"
  >
    0
  </span>

</a>


<!-- =====================================================
     TOAST
===================================================== -->

<div
  id="toast"
  class="toast"
></div>


<!-- =====================================================
     FOOTER
===================================================== -->

  <footer class="footer">

    <div class="footer-container">


      <!-- BRAND -->

      <div class="footer-section">

        <h3>
          LazyShop
        </h3>

        <p>
          Your one-stop shop for everything.
        </p>

      </div>


      <!-- CONTACT -->

      <div class="footer-section">

        <h4>
          Contact
        </h4>

        <p>
          Email: support@email.com
        </p>

        <p>
          Phone: +233...
        </p>

      </div>


      <!-- LINKS -->

      <div class="footer-section">

        <h4>
          Quick Links
        </h4>

        <a href="#">
          Home
        </a>

        <a href="/demos/ecommerce/login.html">
          Cart
        </a>

        <a href="/demos/ecommerce/login.html">
          Account
        </a>

      </div>


    </div>


    <div class="footer-bottom">

      © 2026 LazyShop — All rights reserved.

    </div>

  </footer>


<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="js/data.js"></script>

<script
  src="js/cartUtils.js"
  defer
></script>

<script
  src="js/cartBadge.js"
  defer
></script>

<script
  src="js/login.js"
  defer
></script>


<script type="module">

/* =====================================================
   ELEMENTS
===================================================== */

const grid =
  document.getElementById("productGrid");

const search =
  document.getElementById("search");

const toast =
  document.getElementById("toast");

let current = "all";

let toastTimer;


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {

    toast.classList.remove("show");

  },2000);

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function render(list){

  grid.innerHTML = "";

  if(list.length === 0){

    grid.innerHTML = `

      <div class="empty-state">

        <div class="empty-state-icon">
          🔍
        </div>

        <h3>
          No products found
        </h3>

        <p>
          Try another search or category.
        </p>

      </div>

    `;

    return;
  }


  list.forEach(product => {

    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <a
        href="/demos/ecommerce/productDetail.html?id=${product.id}"
        class="product-link"
      >

        <div class="product-image">

          <img
            src="${product.images[0]}"
            alt="${product.name}"
          />

        </div>


        <div class="card-body">

          <strong class="product-name">
            ${product.name}
          </strong>

          <div class="price">
            $${Number(product.price).toFixed(2)}
          </div>

          <div class="rating">
            ⭐ ${product.rating}
            (${product.reviews})
          </div>

          <button
            type="button"
            class="add-to-cart"
          >
            Add to Cart
          </button>

        </div>

      </a>

    `;


    const button =
      card.querySelector(".add-to-cart");


    button.addEventListener(
      "click",
      function(event){

        event.preventDefault();

        event.stopPropagation();

        addToCart(product);

      }
    );


    grid.appendChild(card);

  });

}


/* =====================================================
   FILTER
===================================================== */

function apply(){

  const query =
    search.value
      .toLowerCase()
      .trim();


  let list =
    products.filter(product =>

      product.name
        .toLowerCase()
        .includes(query)

    );


  if(current !== "all"){

    list =
      list.filter(product =>
        product.category === current
      );

  }


  render(list);

}


/* =====================================================
   CART
===================================================== */

function addToCart(product){

  const cart =
    getCart();


  const existing =
    cart.find(item =>
      item.id === product.id
    );


  if(existing){

    existing.quantity += 1;

    showToast(
      "Quantity updated in cart"
    );

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:product.price,

      image:product.images[0],

      quantity:1

    });

    showToast(
      "Added to cart"
    );

  }


  saveCart(cart);

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
  "input",
  apply
);


/* =====================================================
   CATEGORY FILTER
===================================================== */

const categoryButtons =
  document.querySelectorAll(
    "[data-cat]"
  );


categoryButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      current =
        button.dataset.cat;


      categoryButtons.forEach(btn => {

        if(btn.dataset.cat === current){

          btn.classList.add("active");

        }else{

          btn.classList.remove("active");

        }

      });


      apply();

    }
  );

});


/* =====================================================
   INITIALIZE
===================================================== */

render(products);

</script>

</body>
</html>
