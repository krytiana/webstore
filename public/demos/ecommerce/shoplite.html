<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShopLite</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, sans-serif;
    }

    :root {
      --primary: #c26a06;
      --secondary: #ed4f3a;

      --background: #f7f7fa;
      --surface: #ffffff;
      --surfaceAlt: #f1f2f6;

      --heading: #111827;
      --text: #374151;
      --muted: #6b7280;
      --interaction: #ffffff;

      --border: #e5e7eb;

      --radius: 18px;
    }

    body {
      background: var(--background);
      color: var(--text);
    }


    /* ================= HEADER ================= */

    .header {
      background: rgba(180, 69, 5, 0.96);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      padding: 15px;

      position: sticky;
      top: 0;

      z-index: 100;
    }

    .top-bar {
      max-width: 1200px;

      margin: auto;

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 12px;

      color: var(--surface);

      font-size: 14px;
    }

    .logo h2 {
      font-size: 21px;

      font-weight: 800;

      letter-spacing: -.5px;
    }

    .top-bar a {
      color: var(--surface);

      text-decoration: none;

      margin-left: 10px;
    }


    /* ================= SEARCH ================= */

    .search-box {
      max-width: 1200px;

      margin: auto;

      background: var(--surface);

      padding: 12px 16px;

      border-radius: 30px;

      box-shadow:
        0 8px 25px rgba(0,0,0,.12);
    }

    .search-box input {
      border: none;

      outline: none;

      width: 100%;

      font-size: 16px;

      background: transparent;

      color: var(--heading);
    }


    /* ================= CATEGORIES ================= */

    .categories {
      display: flex;

      gap: 24px;

      overflow-x: auto;

      padding: 15px 20px;

      background: var(--surface);

      position: sticky;

      top: 105px;

      z-index: 99;

      border-bottom: 1px solid var(--border);

      box-shadow:
        0 4px 15px rgba(0,0,0,.04);
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-item {
      color: var(--muted);

      white-space: nowrap;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      padding-bottom: 5px;

      transition: .2s;
    }

    .category-item:hover {
      color: var(--primary);
    }

    .category-item.active {
      color: var(--primary);

      font-weight: 800;

      border-bottom: 2px solid var(--primary);
    }


    /* ================= HERO ================= */

    .hero {
      max-width: 1200px;

      margin: 35px auto;

      padding: 0 20px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 40px;

      align-items: center;
    }

    .hero h1 {
      font-size: 42px;

      line-height: 1.1;

      color: var(--heading);

      letter-spacing: -1px;
    }

    .hero p {
      margin-top: 14px;

      color: var(--muted);

      line-height: 1.7;

      max-width: 480px;
    }

    .slides {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      overflow: hidden;

      border-radius: var(--radius);

      background: var(--surface);

      box-shadow:
        0 15px 40px rgba(0,0,0,.10);
    }

    .slide {
      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      opacity: 0;

      transition: opacity .8s ease;
    }

    .slide.active {
      opacity: 1;
    }


    /* ================= DELIVERY ================= */

    .delivery {
      max-width: 1200px;

      margin: 20px auto;

      background: var(--surface);

      padding: 14px 18px;

      display: flex;

      justify-content: space-between;

      gap: 20px;

      font-size: 14px;

      color: var(--text);

      border: 1px solid var(--border);

      border-radius: 14px;
    }


    /* ================= PRODUCTS ================= */

    .products {
      max-width: 1200px;

      margin: 25px auto 60px;

      padding: 0 20px;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;
    }

    .product-card {
      background: var(--surface);

      border-radius: var(--radius);

      padding: 8px;

      border: 1px solid var(--border);

      box-shadow:
        0 8px 25px rgba(0,0,0,.05);

      overflow: hidden;

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);

      box-shadow:
        0 18px 40px rgba(0,0,0,.10);
    }

    .product-card img {
      width: 100%;

      height: 190px;

      object-fit: cover;

      border-radius: 13px;

      transition: transform .4s ease;
    }

    .product-card:hover img {
      transform: scale(1.03);
    }

    .product-link {
      text-decoration: none;

      display: block;
    }

    .title {
      font-size: 14px;

      margin: 9px 4px 5px;

      min-height: 38px;

      overflow: hidden;

      color: var(--heading);

      font-weight: 700;

      line-height: 1.4;
    }

    .price {
      color: var(--primary);

      font-weight: 800;

      font-size: 15px;

      margin: 0 4px;
    }

    .rating {
      font-size: 12px;

      color: var(--muted);

      margin: 5px 4px 8px;
    }


    /* ================= FLOATING CART ================= */

    .floating-cart {
      position: fixed;

      bottom: 20px;

      right: 20px;

      background: var(--primary);

      color: var(--interaction);

      border: 3px solid #fff;

      width: 57px;

      height: 57px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 24px;

      text-decoration: none;

      box-shadow:
        0 10px 30px rgba(0,0,0,.25);

      z-index: 1000;

      transition: .25s;
    }

    .floating-cart:hover {
      transform: translateY(-4px) scale(1.04);
    }

    .floating-cart-count {
      position: absolute;

      top: -5px;

      right: -5px;

      background: #ef4444;

      color: white;

      font-size: 11px;

      font-weight: 800;

      padding: 2px 6px;

      border-radius: 50%;

      min-width: 19px;

      text-align: center;

      border: 2px solid #fff;

      display: none;
    }


    /* ================= FOOTER ================= */

    .footer {
      background: var(--surface);

      color: var(--text);

      padding: 35px 20px 12px;

      margin-top: 40px;

      border-top: 1px solid var(--border);
    }

    .footer-container {
      max-width: 1200px;

      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

      gap: 25px;
    }

    .footer-section h3,
    .footer-section h4 {
      margin-bottom: 10px;

      color: var(--heading);
    }

    .footer-section p {
      font-size: 14px;

      margin-bottom: 6px;

      color: var(--text);
    }

    .footer-section a {
      display: block;

      font-size: 14px;

      color: var(--text);

      margin-bottom: 6px;

      text-decoration: none;
    }

    .footer-section a:hover {
      color: var(--secondary);
    }

    .footer-bottom {
      text-align: center;

      max-width: 1200px;

      margin: 25px auto 0;

      border-top: 1px solid var(--border);

      padding-top: 12px;

      font-size: 13px;

      color: var(--muted);
    }

    /* ================= RESPONSIVE ================= */

    @media (min-width: 768px) {

      .products {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
      }

    }


    @media (max-width: 900px) {

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-text {
        display: none;
      }

    }


    @media screen and (max-width: 480px) {

      .hero {
        padding: 0 14px;

        margin: 25px auto;
      }

      .hero h1 {
        font-size: 22px;
      }

      .delivery {
        margin: 15px;

        font-size: 12px;
      }

      .products {
        padding: 0 14px;
      }

      .product-card img {
        height: 160px;
      }

      .categories {
        top: 105px;
      }

    }

  </style>

</head>


<body>


  <!-- ================= HEADER ================= -->

  <div class="header">

    <div class="top-bar">

      <div class="logo">

        <h2>
          ShopLite
        </h2>

      </div>

      <div id="userSection">

        <a href="/demos/ecommerce/login.html">
          Login
        </a>

      </div>

    </div>


    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
      >

    </div>

  </div>



  <!-- ================= CART ================= -->

  <a
    href="/demos/ecommerce/cart.html"
    class="floating-cart"
    aria-label="Shopping cart"
  >

    🛒

    <span
      id="floatingCartCount"
      class="floating-cart-count"
    >
      0
    </span>

  </a>



  <!-- ================= HERO ================= -->

  <section
    class="hero"
    id="heroSection"
  >

    <div class="hero-text">

      <h1>
        Welcome to ShopLite
      </h1>

      <p>
        Your one-stop shop for all your needs.
      </p>

    </div>


    <div class="slides">

      <img
        src="images/dress1.jpg"
        class="slide active"
        alt="Shop collection"
      >

      <img
        src="images/shoe1.jpg"
        class="slide"
        alt="Shoes collection"
      >

      <img
        src="images/bag1.jpg"
        class="slide"
        alt="Accessories collection"
      >

    </div>

  </section>



  <!-- ================= CATEGORIES ================= -->

  <div
    class="categories"
    id="categoryContainer"
  ></div>



  <!-- ================= DELIVERY ================= -->

  <div class="delivery">

    <div>
      🚚 Free Shipping
    </div>

    <div>
      🔒 Secure Payment
    </div>

  </div>



  <!-- ================= PRODUCTS ================= -->

  <div
    class="products"
    id="productContainer"
  ></div>



  <!-- ================= FOOTER ================= -->

  <footer class="footer">

    <div class="footer-container">


      <!-- BRAND -->

      <div class="footer-section">

        <h3>
          ShopLite
        </h3>

        <p>
          Your one-stop shop for everything.
        </p>

      </div>


      <!-- CONTACT -->

      <div class="footer-section">

        <h4>
          Contact
        </h4>

        <p>
          Email: support@email.com
        </p>

        <p>
          Phone: +233...
        </p>

      </div>


      <!-- LINKS -->

      <div class="footer-section">

        <h4>
          Quick Links
        </h4>

        <a href="#">
          Home
        </a>

        <a href="/demos/ecommerce/login.html">
          Cart
        </a>

        <a href="/demos/ecommerce/login.html">
          Account
        </a>

      </div>


    </div>


    <div class="footer-bottom">

      © 2026 ShopLite — All rights reserved.

    </div>

  </footer>



  <!-- ================= DATA ================= -->

  <script src="js/data.js"></script>

  <script
    src="js/cartUtils.js"
    defer
  ></script>

  <script
    src="js/cartBadge.js"
    defer
  ></script>





  <!-- ================= PAGE JAVASCRIPT ================= -->

  <script>

    /* ================= HERO SLIDER ================= */

    let currentSlide = 0;

    const slides =
      document.querySelectorAll(
        ".slides img"
      );

    const totalSlides =
      slides.length;


    function showSlide(index) {

      if (!totalSlides) return;

      slides.forEach(
        (slide, i) => {

          slide.classList.toggle(
            "active",
            i === index
          );

        }
      );

    }


    function nextSlide() {

      if (!totalSlides) return;

      currentSlide =
        (currentSlide + 1) %
        totalSlides;

      showSlide(currentSlide);

    }


    function prevSlide() {

      if (!totalSlides) return;

      currentSlide =
        (currentSlide - 1 + totalSlides) %
        totalSlides;

      showSlide(currentSlide);

    }


    if (totalSlides > 1) {

      setInterval(
        nextSlide,
        5000
      );

    }



    /* ================= PAGE ELEMENTS ================= */

    const productContainer =
      document.getElementById(
        "productContainer"
      );

    const categoryContainer =
      document.getElementById(
        "categoryContainer"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const heroSection =
      document.getElementById(
        "heroSection"
      );


    let currentCategory = "all";



    /* ================= RENDER PRODUCTS ================= */

    function renderProducts(productList) {

      productContainer.innerHTML = "";


      if (productList.length === 0) {

        productContainer.innerHTML = `

          <div style="
            grid-column:1/-1;
            background:#fff;
            padding:40px;
            border-radius:18px;
            text-align:center;
            color:#6b7280;
          ">

            No products found.

          </div>

        `;

        return;

      }


      productList.forEach(product => {

        const card =
          document.createElement("div");

        card.className =
          "product-card";


        card.innerHTML = `

          <a
            href="/demos/ecommerce/productDetail.html?id=${product.id}"
            class="product-link"
          >

            <img
              src="${product.images[0]}"
              alt="${product.name}"
              loading="lazy"
            >

            <div class="title">
              ${product.name}
            </div>

            <div class="price">
              $${Number(product.price).toFixed(2)}
            </div>

            <div class="rating">
              ⭐ ${product.rating}
              (${product.reviews})
            </div>

          </a>

        `;


        productContainer.appendChild(card);

      });

    }



    /* ================= GENERATE CATEGORIES ================= */

    function generateCategories() {

      categoryContainer.innerHTML = "";


      const categories = [
        "all",
        ...new Set(
          products
            .map(
              p => p.category
            )
            .filter(Boolean)
        )
      ];


      categories.forEach(category => {

        const div =
          document.createElement("div");

        div.className =
          "category-item";

        div.textContent =
          category.toUpperCase();


        if (category === "all") {

          div.classList.add("active");

        }


        div.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".category-item"
              )
              .forEach(item =>
                item.classList.remove(
                  "active"
                )
              );


            div.classList.add(
              "active"
            );


            currentCategory =
              category;


            filterProducts();

          }
        );


        categoryContainer.appendChild(
          div
        );

      });

    }



    /* ================= FILTER ================= */

    function filterProducts() {

      let filtered = [
        ...products
      ];


      /* CATEGORY */

      if (
        currentCategory !== "all"
      ) {

        filtered =
          filtered.filter(
            product =>
              product.category ===
              currentCategory
          );

      }


      /* SEARCH */

      const searchValue =
        searchInput.value
          .toLowerCase()
          .trim();


      if (searchValue) {

        filtered =
          filtered.filter(
            product =>
              product.name
                .toLowerCase()
                .includes(
                  searchValue
                )
          );


        heroSection.style.display =
          "none";

      } else {

        heroSection.style.display =
          "grid";

      }


      renderProducts(
        filtered
      );

    }



    /* ================= SEARCH ================= */

    searchInput.addEventListener(
      "input",
      filterProducts
    );



    /* ================= INITIALIZE ================= */

    generateCategories();

    renderProducts(
      products
    );

  </script>


</body>

</html>
