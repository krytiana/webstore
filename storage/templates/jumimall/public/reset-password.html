<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 440px; margin: 60px auto; padding: 20px; }
    form { display: grid; gap: 12px; }
    input, button { padding: 12px; font: inherit; }
    button { cursor: pointer; }
    #message { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Reset your password</h1>
  <p>Choose a new password of at least 8 characters.</p>
  <form id="resetForm">
    <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
    <input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Confirm password" required>
    <button type="submit">Reset password</button>
  </form>
  <p id="message" role="status"></p>
  <script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const token = decodeURIComponent(location.pathname.split("/").pop() || "");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password.length < 8 || password !== confirm) {
        message.textContent = "Passwords must match and be at least 8 characters.";
        return;
      }

      try {
        const response = await fetch("/api/auth/reset-password/" + encodeURIComponent(token), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ newPassword: password })
        });

        const data = await response.json();
        message.textContent = data.message || "Unable to reset password.";

        if (response.ok) {
          form.reset();
          setTimeout(() => { location.href = "/register/"; }, 1500);
        }
      } catch {
        message.textContent = "Network error. Please try again.";
      }
    });
  </script>
</body>
</html>
